services:
  steampipe:
    image: ghcr.io/devops-ia/steampipe:v2.4.1
    container_name: steampipe
    command: steampipe service start --foreground --database-listen network
    ports:
      - "9193:9193"
    volumes:
      - steampipe-data:/home/steampipe/.steampipe
    environment:
      STEAMPIPE_DATABASE_PASSWORD: steampipe
      STEAMPIPE_UPDATE_CHECK: "false"
      STEAMPIPE_TELEMETRY: none
      STEAMPIPE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 9193 -U steampipe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  powerpipe:
    image: ghcr.io/devops-ia/powerpipe:1.5.1
    container_name: powerpipe
    ports:
      - "9033:9033"
    volumes:
      - workspace:/workspace
    environment:
      POWERPIPE_DATABASE: "postgres://steampipe:steampipe@steampipe:9193/steampipe"
      POWERPIPE_UPDATE_CHECK: "false"
      POWERPIPE_TELEMETRY: none
      POWERPIPE_LISTEN: network
    depends_on:
      steampipe:
        condition: service_healthy
    restart: unless-stopped

volumes:
  steampipe-data:
  workspace:
